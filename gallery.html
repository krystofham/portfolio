<!DOCTYPE html>
<html lang="cs">

<head>
    <script>if(localStorage.getItem("mode")==="dark")document.documentElement.classList.add("dark-mode");</script>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="styles.css">
    <style>
        /* Gallery-specific placeholder styling */
        .gallery-placeholder {
            width: 100%;
            height: 100%;
            background: var(--gray-5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: var(--muted);
            font-size: 0.75rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            transition: background var(--transition);
        }

        .gallery-item:hover .gallery-placeholder {
            background: var(--gray-4);
        }

        .dark-mode .gallery-placeholder {
            background: var(--gray-2);
        }

        .dark-mode .gallery-item:hover .gallery-placeholder {
            background: var(--gray-3);
        }

        /* Gallery filter buttons */
        .gallery-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: clamp(1.5rem, 4vw, 3rem);
        }

        .filter-btn {
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 7px 16px;
            border: 1px solid var(--border);
            border-radius: 100px;
            background: transparent;
            color: var(--fg);
            transition: background var(--transition), color var(--transition), border-color var(--transition);
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--fg);
            color: var(--bg);
        }

        .filter-btn.active {
            border-color: var(--fg);
        }

        /* Hide filtered items */
        .gallery-item[data-cat].hidden {
            display: none;
        }

        /* Featured first item — spans 2 cols */
        @media (min-width: 480px) {
            .gallery-grid .gallery-item:nth-child(1),
            .gallery-grid .gallery-item:nth-child(2) {
                grid-column: span 2;
                aspect-ratio: 2 / 1;
            }
        }
    </style>
</head>
